[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketsentry"
version = "0.1.0"
description = "Buyer-side real-estate market observation and watchlist system for Temecula/Murrieta"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Market_Sentry Development Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.0.280",
    "mypy>=1.4.0",
]

[project.scripts]
marketsentry = "marketsentry.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=marketsentry --cov-report=term-missing"

[tool.coverage.report]
# Stabilization floor, not the target. Measured coverage is ~76.3%.
# The floor sits one point below that on purpose: a gate set exactly
# at the current value flips red on the first uncovered line anyone
# adds, which trains people to bypass it. One point of headroom keeps
# the gate meaningful and trustworthy.
#
# Goal: 80%. Raise this floor as real coverage climbs; never lower it.
#
# Live-network code paths (source_adapters/http_client.py, the HowLoud
# adapter's fetch path) are covered with fakes and mocks only. Do not
# add tests that make real network calls to inflate this number, and
# do not treat those modules' lower coverage as a defect to fix that
# way. See docs/decisions/055-workflow-test-coverage-stabilization.md.
fail_under = 75
precision = 2
show_missing = true
